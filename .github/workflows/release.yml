name: SyntricDB Release & Cloud Publishing Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: 🚀 Build, Package & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Run Test Suite
        run: mvn clean test -B

      - name: 📦 Build Executable Shaded JAR
        run: mvn package -DskipTests -B

      - name: 🗂️ Package Multi-Platform Release Archives
        run: |
          chmod +x deploy/package_releases.sh
          ./deploy/package_releases.sh

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: 🚀 Build & Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 🎉 Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          name: "SyntricDB Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.zip
            target/syntricdb-engine-*.jar
            docker-compose.yml
            deploy/syntricdb.conf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
