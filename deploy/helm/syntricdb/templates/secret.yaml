apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syntricdb.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "syntricdb.name" . }}
    helm.sh/chart: {{ include "syntricdb.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SYNTRICDB_ADMIN_USER: {{ .Values.config.adminUser | quote }}
  SYNTRICDB_ADMIN_PASSWORD: {{ .Values.config.adminPassword | quote }}
