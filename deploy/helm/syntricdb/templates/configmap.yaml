apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syntricdb.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "syntricdb.name" . }}
    helm.sh/chart: {{ include "syntricdb.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  SYNTRICDB_BIND_ADDRESS: {{ .Values.config.bindAddress | quote }}
  SYNTRICDB_PORT: {{ .Values.config.port | quote }}
  SYNTRICDB_AUTH_ENABLED: {{ .Values.config.authEnabled | quote }}
  SYNTRICDB_DATA_DIR: {{ .Values.config.dataDir | quote }}
