apiVersion: v1
kind: Service
metadata:
  name: {{ include "syntricdb.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "syntricdb.name" . }}
    helm.sh/chart: {{ include "syntricdb.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http-api
  selector:
    app.kubernetes.io/name: {{ include "syntricdb.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
